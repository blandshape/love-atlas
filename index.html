:root{color-scheme:dark;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}*{box-sizing:border-box}body{background:#10121d;color:#f0eef8;margin:0;line-height:1.7}main{max-width:750px;margin:auto;padding:22px 17px 80px}.brand{letter-spacing:.19em;font-size:12px;color:#b5a9fa}.panel{border:1px solid #373449;border-radius:20px;background:#1a1b2b;padding:25px;margin-top:20px}.muted{color:#b3b0c5;font-size:14px}.tag{display:inline-block;background:#302e4b;border-radius:99px;padding:3px 12px;font-size:12px;color:#d5d0fa}h1{font-size:30px;line-height:1.3}h2{font-size:21px;line-height:1.4}.options{display:grid;gap:9px;margin:18px 0}.opt{border:1px solid #4c4863;background:#242538;color:#fff;border-radius:12px;padding:13px;text-align:left;font-size:15px;cursor:pointer}.opt[aria-pressed=true]{background:#514a88;border-color:#b3a6ff}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}button{cursor:pointer}button.primary{background:#aa9aff;color:#161229;border:0;border-radius:12px;padding:12px 20px;font-weight:700}button.secondary{background:transparent;color:#e5e1ff;border:1px solid #66617d;border-radius:12px;padding:12px 20px}button:disabled{opacity:.35;cursor:not-allowed}.bar{height:7px;background:#333348;border-radius:20px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:#aa9aff}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.scale button{background:#26273a;color:white;border:1px solid #56536c;border-radius:12px;padding:15px 2px;font-size:17px}.scale button.selected{background:#655ca2;border-color:#c6baff}.poles{display:flex;justify-content:space-between;gap:20px;color:#b3b0c5;font-size:13px}.result{border-top:1px solid #45425d;padding:15px 0}.metric{display:flex;justify-content:space-between;gap:10px;font-size:14px}.meter{height:8px;background:#343248;border-radius:10px;overflow:hidden}.meter div{height:100%;background:#b3a4ff}.note{border-left:3px solid #a99aff;padding:12px;background:#29263b; </style></head><body><main><div class="brand">LOVE ATLAS / V0.8</div><div id="app"></div><footer>探索原型，不是診斷工具。尚未經過信效度驗證；答案只在本機運算，除非你自行匯出。</footer></main><script>

let state={phase:'welcome',path:'offline',adult:false,answers:{},index:0,base:[],pair:null,follow:[],followIndex:0,extra:{},saved:false};
const valid=q=>!q.need||state.path!=='one';

function scores(){const total={},count={};for(const q of state.base){if(state.answers[q.id]!=null){total[q.dim]=(total[q.dim]||0)+state.answers[q.id];count[q.dim]=(count[q.dim]||0)+1}}return Object.fromEntries(Object.keys(LABEL).map(k=>[k,count[k]?total[k]/count[k]:null]))}

function selectFollow(){const r=ranking(),top=r[0]?.[0]||'cur',second=r[1]?.[0]||'rom';const key=[top,second].sort().join(':');const candidates=DIFF[key]||GENERAL;state.pair=DIFF[key]?key.split(':'):[top,second];state.follow=candidates.map((x,i)=>({...x,id:'f'+i}));state.followIndex=0;state.phase='follow';render()}

function showQuestion(q,n,total,follow=false){const val=state.answers[q.id];const opts=follow?q.a.map((t,i)=>[i,t]):[[0,'完全不像'],[1,'比較不像'],[2,'有點像'],[3,'很像'],[4,'非常像']];app.innerHTML='<section class="panel"><span class="tag">'+(follow?'關鍵鑑別':'先辨識你的感受')+' · '+n+' / '+total+'</span><div class="bar"><div style="width:'+(n/total*100)+'%"></div></div><h2>'+esc(q.q)+'</h2><p class="muted">'+(follow?'這一題用來區分兩種可能的解釋，不是考你對錯。':'請以這個人為對象，依目前的實際感受回答。')+'</p><div class="options">'+opts.map(([v,t])=>'<button class="opt" data-val="'+v+'" aria-pressed="'+(val===v)+'">'+esc(t)+'</button>').join('')+'</div><div class="actions"><button class="secondary" id="back">← 上一題</button><button class="primary" id="next" '+(val==null?'disabled':'')+'>'+(n===total?(follow?'查看結果':'進入鑑別'):'下一題')+' →</button></div></section>';document.querySelectorAll('[data-val]').forEach(el=>el.onclick=()=>{state.answers[q.id]=Number(el.dataset.val);render()});document.querySelector('#back').onclick=()=>{if(follow){if(state.followIndex>0)state.followIndex--;else{state.phase='base';state.index=state.base.length-1}}else if(state.index>0)state.index--;else state.phase='setup';render()};document.querySelector('#next').onclick=()=>{if(state.answers[q.id]==null)return;if(follow){if(++state.followIndex>=state.follow.length)state.phase='result'}else{if(++state.index>=state.base.length)selectFollow();else render();return}render()}}
function render(){

ne',adult:false,answers:{},index:0,base:[],pair:null,follow:[],followIndex:0,extra:{},saved:false};render()};return}
